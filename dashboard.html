<!DOCTYPE html>
<html>
<head>
    <title>NIFTY 50 Alpha Engine</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
        }

        .container {
            max-width: 750px;
            margin: auto;
            padding: 20px;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.8s ease;
        }

        .container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        h1 {
            margin-top: 40px;
            font-size: 26px;
        }

        .subtitle {
            opacity: 0.7;
            font-size: 14px;
            margin-bottom: 20px;
        }

        select {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            margin-top: 15px;
        }

        button {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            background: linear-gradient(90deg,#2563eb,#7c3aed);
            color: white;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s ease;
        }

        button:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 25px rgba(124,58,237,0.4);
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 18px;
            margin-top: 25px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.5s ease;
        }

        .card.show {
            opacity: 1;
            transform: translateY(0);
        }

        .risk-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            margin-top: 8px;
            font-weight: 600;
        }

        .error-box {
            background: #1e293b;
            border: 1px solid #ef4444;
            padding: 20px;
            border-radius: 14px;
            margin-top: 20px;
        }

        .error-box p {
            margin: 0 0 12px 0;
            opacity: 0.9;
        }

        .leaderboard-wrap {
            max-height: 420px;
            overflow-y: auto;
            margin-top: 15px;
            border-radius: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            padding: 8px 10px;
            text-align: left;
        }

        thead th {
            position: sticky;
            top: 0;
            background: #1e293b;
            opacity: 1;
        }

        tbody tr:nth-child(even) {
            background: rgba(255,255,255,0.03);
        }

        .change-up { color: #22c55e; }
        .change-down { color: #ef4444; }
        .change-flat { opacity: 0.5; }

        #loader {
            position: fixed;
            background: #0f172a;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 999;
        }

        .spinner {
            border: 5px solid #1e293b;
            border-top: 5px solid #7c3aed;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            h1 { font-size: 22px; }
        }
    </style>
</head>

<body>

<div id="loader">
    <div class="spinner"></div>
    <p>Loading Alpha Model...</p>
</div>

<div class="container" id="mainContent">

    <h1>NIFTY 50 Alpha Engine</h1>
    <div class="subtitle">
        Daily 20-Day Relative Outperformance Model
    </div>

    <select id="stockSelect"></select>
    <button id="predictBtn" onclick="predictStock()" disabled>
        Check 20-Day Outlook
    </button>

    <div id="resultBox"></div>
    <div id="topPerformer" class="card"></div>

    <div class="card show" id="leaderboardCard" style="text-align:left; display:none;">
        <h3>Full Leaderboard</h3>
        <div class="leaderboard-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Stock</th>
                        <th>Score</th>
                        <th>Chg</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody"></tbody>
            </table>
        </div>
    </div>

    <div class="card show">
        <h3>Feedback</h3>
        <button onclick="window.open('https://forms.gle/sdGJKq2aE2jZfeVU6')">
            Submit Feedback
        </button>
    </div>

</div>

<script>

const API_URL = "https://nifty50-alpha-engine.onrender.com/rank";
const FETCH_TIMEOUT_MS = 15000;
let cachedData = null;

async function fetchWithTimeout(url, ms) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), ms);
    try {
        return await fetch(url, { signal: controller.signal });
    } finally {
        clearTimeout(timer);
    }
}

async function loadStocks() {
    document.getElementById("loader").style.display = "flex";
    document.getElementById("loader").innerHTML = `
        <div class="spinner"></div>
        <p>Loading Alpha Model...</p>
    `;

    try {
        const response = await fetchWithTimeout(API_URL, FETCH_TIMEOUT_MS);
        const data = await response.json();

        if (data.status !== "success") {
            showLoadError(data.message || "Model data is temporarily unavailable.");
            return;
        }

        cachedData = data;

        const select = document.getElementById("stockSelect");
        select.innerHTML = "";

        const sorted = [...data.ranking].sort((a,b) =>
            a.ticker.localeCompare(b.ticker)
        );

        sorted.forEach(stock => {
            const option = document.createElement("option");
            option.value = stock.ticker;
            option.textContent = stock.ticker.replace(".NS","");
            select.appendChild(option);
        });

        showTopPerformer();
        renderLeaderboard();

        document.getElementById("predictBtn").disabled = false;
        document.getElementById("loader").style.display = "none";
        document.getElementById("mainContent").classList.add("visible");

    } catch (err) {
        const reason = err.name === "AbortError"
            ? "The model server took too long to respond."
            : "Unable to connect to model server.";
        showLoadError(reason);
    }
}

function showLoadError(message) {
    document.getElementById("loader").innerHTML = `
        <div class="error-box">
            <p>${message}</p>
            <button onclick="loadStocks()">Try Again</button>
        </div>
    `;
}

function rankChangeLabel(change) {
    if (change === null || change === undefined) {
        return `<span class="change-flat">NEW</span>`;
    }
    if (change > 0) {
        return `<span class="change-up">&#9650; ${change}</span>`;
    }
    if (change < 0) {
        return `<span class="change-down">&#9660; ${Math.abs(change)}</span>`;
    }
    return `<span class="change-flat">&mdash;</span>`;
}

function renderLeaderboard() {
    const body = document.getElementById("leaderboardBody");
    body.innerHTML = cachedData.ranking.map(stock => `
        <tr>
            <td>${stock.rank}</td>
            <td>${stock.ticker.replace(".NS","")}</td>
            <td>${stock.score}</td>
            <td>${rankChangeLabel(stock.rank_change)}</td>
        </tr>
    `).join("");

    document.getElementById("leaderboardCard").style.display = "block";
}

function showTopPerformer() {
    const top = cachedData.ranking[0];
    const topCard = document.getElementById("topPerformer");

    topCard.innerHTML = `
        <h3>Top Ranked Stock Today</h3>
        <p><strong>${top.ticker}</strong> ${rankChangeLabel(top.rank_change)}</p>
        <p>Rank: 1 / ${cachedData.total_stocks}</p>
        <p style="font-size:12px; opacity:0.6;">
            Model Updated: ${cachedData.last_updated}
        </p>
    `;

    topCard.classList.add("show");
}

function predictStock() {

    const ticker = document.getElementById("stockSelect").value;
    const stock = cachedData.ranking.find(s => s.ticker === ticker);
    if (!stock) return;

    const today = new Date();
    const futureDate = new Date();
    futureDate.setDate(today.getDate() + 20);
    const formattedFuture = futureDate.toLocaleDateString();

    let riskLevel = "Moderate";
    let riskColor = "#eab308";

    if (stock.percentile >= 70) {
        riskLevel = "Low Risk";
        riskColor = "#22c55e";
    } else if (stock.percentile <= 40) {
        riskLevel = "Elevated Risk";
        riskColor = "#ef4444";
    }

    const box = document.getElementById("resultBox");

    box.innerHTML = `
        <div class="card show">
            <h3>${stock.ticker}</h3>
            <p><strong>Rank:</strong> ${stock.rank} / ${cachedData.total_stocks} ${rankChangeLabel(stock.rank_change)}</p>
            <p style="margin-top:10px;">
                Expected relative performance over next 20 trading days.
            </p>

            <div class="risk-badge" style="background:${riskColor}20; color:${riskColor}; border:1px solid ${riskColor};">
                ${riskLevel}
            </div>

            <p style="font-size:13px; opacity:0.7; margin-top:15px;">
                Forecast Horizon Ends: ${formattedFuture}
            </p>

            <p style="font-size:12px; opacity:0.5;">
                Model Last Updated: ${cachedData.last_updated}
            </p>
        </div>
    `;

    // Move top performer below selected stock
    const topCard = document.getElementById("topPerformer");
    topCard.parentNode.appendChild(topCard);
}

document.addEventListener("DOMContentLoaded", loadStocks);

</script>

</body>
</html>
